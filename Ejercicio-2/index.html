<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Pedidos | Cafetería</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
  <script src="pedidos.js" defer></script>
</head>
<body>

  <nav class="navbar navbar-cafe mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">Cafetería · Gestión de pedidos</span>
    </div>
  </nav>

  <main class="container pb-5">
    <div class="row g-4">

      <section class="col-lg-4">
        <div class="card tarjeta-cafe">
          <div class="card-header">Nuevo pedido</div>
          <div class="card-body">
            <form id="form-pedido" novalidate>
              <div class="mb-3">
                <label for="producto" class="form-label">Producto</label>
                <input type="text" class="form-control" id="producto" placeholder="Ej: Café americano" required>
                <div class="invalid-feedback" id="error-producto"></div>
              </div>

              <div class="mb-3">
                <label for="precio" class="form-label">Precio unitario ($)</label>
                <input type="number" class="form-control" id="precio" placeholder="0.00" step="0.01" required>
                <div class="invalid-feedback" id="error-precio"></div>
              </div>

              <div class="mb-3">
                <label for="cantidad" class="form-label">Cantidad</label>
                <input type="number" class="form-control" id="cantidad" placeholder="1" step="1" required>
                <div class="invalid-feedback" id="error-cantidad"></div>
              </div>

              <button type="submit" class="btn btn-cafe w-100" id="btn-agregar">Agregar pedido</button>
            </form>
          </div>
        </div>
      </section>

      <section class="col-lg-8">
        <div class="card tarjeta-cafe">
          <div class="card-header">Pedidos registrados</div>
          <div class="card-body">

            <div class="row g-2 align-items-end mb-3">
              <div class="col-sm-4">
                <label for="precio-maximo" class="form-label">Precio máximo ($)</label>
                <input type="number" class="form-control" id="precio-maximo" placeholder="Ej: 3.00" step="0.01" min="0">
                <div class="invalid-feedback" id="error-filtro"></div>
              </div>
              <div class="col-sm-8 d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-outline-cafe" id="btn-filtrar">Filtrar productos</button>
                <button type="button" class="btn btn-outline-cafe" id="btn-mostrar-todos">Mostrar todos</button>
                <button type="button" class="btn btn-outline-danger ms-sm-auto" id="btn-limpiar">Limpiar pedidos</button>
              </div>
            </div>

            <div class="table-responsive">
              <table class="table table-hover align-middle tabla-cafe mb-0">
                <thead>
                  <tr>
                    <th>Producto</th>
                    <th class="text-end">Precio unitario</th>
                    <th class="text-end">Cantidad</th>
                    <th class="text-end">Subtotal</th>
                  </tr>
                </thead>
                <tbody id="tabla-pedidos">
                  <tr class="fila-vacia">
                    <td colspan="4" class="text-center text-muted py-4">No hay pedidos para mostrar</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="row g-3 mt-3">
              <div class="col-sm-6">
                <div class="indicador">
                  <span class="indicador-etiqueta">Total de unidades</span>
                  <span class="indicador-valor" id="total-unidades">0</span>
                </div>
              </div>
              <div class="col-sm-6">
                <div class="indicador">
                  <span class="indicador-etiqueta">Monto total</span>
                  <span class="indicador-valor" id="monto-total">$0.00</span>
                </div>
              </div>
            </div>

          </div>
        </div>
      </section>

    </div>
  </main>

</body>
</html>
